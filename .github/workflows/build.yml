# Compila Rullino a ogni modifica su main e pubblica l'APK nella pagina Releases,
# così si può scaricare e installare direttamente dal telefono.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compila l'APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Rinomina l'APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/Rullino-build-${{ github.run_number }}.apk"

      - name: Pubblica in Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Rullino · build ${{ github.run_number }}
          body: |
            ${{ github.event.head_commit.message }}

            Scarica l'APK qui sotto dal telefono e installalo.
          prerelease: true
          make_latest: true
          files: out/*.apk
