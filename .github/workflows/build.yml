# Compila Rullino a ogni modifica su main e pubblica l'APK nella pagina Releases,
# così si può scaricare e installare direttamente dal telefono.
name: Build APK

on:
  push:
    branches: [main]
    # Solo quando cambia l'app Android: sito, iOS, Supabase e strumenti non rifanno l'APK.
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compila l'APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      # Il pacchetto per il Play Store (AAB), firmato con la chiave di caricamento se i segreti ci sono.
      - name: Compila l'AAB per il Play Store
        env:
          UPLOAD_KEYSTORE: ${{ secrets.RULLINO_UPLOAD_KEYSTORE }}
          RULLINO_UPLOAD_PASSWORD: ${{ secrets.RULLINO_UPLOAD_PASSWORD }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE" ]; then
            echo "$UPLOAD_KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export RULLINO_UPLOAD_STORE_FILE="$RUNNER_TEMP/upload.jks"
            ./gradlew --no-daemon bundleRelease
            mkdir -p aab
            cp app/build/outputs/bundle/release/app-release.aab "aab/Rullino-${{ github.run_number }}.aab"
            rm -f "$RUNNER_TEMP/upload.jks"
          else
            echo "::notice::Segreti della chiave di caricamento assenti: niente AAB per il Play Store."
          fi

      - name: Carica l'AAB
        if: hashFiles('aab/*.aab') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Rullino-playstore-${{ github.run_number }}
          path: aab/*.aab
          retention-days: 30

      - name: Rinomina l'APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/Rullino-build-${{ github.run_number }}.apk"

      - name: Pubblica in Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Rullino · build ${{ github.run_number }}
          body: |
            ${{ github.event.head_commit.message }}

            Scarica l'APK qui sotto dal telefono e installalo.
          prerelease: true
          make_latest: true
          files: out/*.apk
